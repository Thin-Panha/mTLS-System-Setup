# /etc/nginx/includes/mtls-auth.conf
#
# Shared mTLS + auth_request configuration. Included by every server block
# that requires a client certificate validated against the MPWT enrollment
# API. Do not duplicate this block per-site -- include it instead, so a
# policy change only needs to happen in one place.

ssl_client_certificate /etc/nginx/ssl/cert/ca-chain.crt;
ssl_verify_client optional_no_ca;
ssl_verify_depth 2;

auth_request /auth-check;

error_page 400 = @silent_drop;
error_page 401 403 = @silent_drop;

if ($ssl_client_verify != "SUCCESS") {
    return 444;
}

location = /auth-check {
    internal;

    proxy_pass https://auth.mpwt.local/api/auth-check;

    proxy_ssl_server_name on;
    proxy_ssl_name auth.mpwt.local;

    proxy_ssl_trusted_certificate /etc/nginx/ssl/cert/ca-chain.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host auth.mpwt.local;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
}

location @silent_drop {
    return 444;
}
